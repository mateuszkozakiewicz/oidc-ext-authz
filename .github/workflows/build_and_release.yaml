name: Build and release

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        go-version: ["1.26"]
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -o oidc-ext-authz main.go
      - name: chmod +x
        run: chmod +x oidc-ext-authz
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute Docker tags
        id: tags
        run: |
          BASE="ghcr.io/${{ github.repository_owner }}/oidc-ext-authz"
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
            TAGS="${BASE}:${MAJOR}.${MINOR}.${PATCH},${BASE}:${MAJOR}.${MINOR},${BASE}:${MAJOR},${BASE}:latest"
          else
            TAGS="${BASE}:${REF}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/oidc-ext-authz:${{ steps.tags.outputs.version }}"
          gh release create "${{ github.ref_name }}" \
            "oidc-ext-authz#oidc-ext-authz-linux-amd64" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Docker image: \`${IMAGE}\`"
