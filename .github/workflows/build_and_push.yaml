name: Push image to GHCR

on:
  push:
    branches: ["master", "v*.*.*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        go-version: ["1.24"]
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -o oidc-ext-authz main.go
      - name: chmod +x
        run: chmod +x oidc-ext-authz
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute Docker tags
        id: tags
        run: |
          BASE="ghcr.io/${{ github.repository_owner }}/oidc-ext-authz"
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            TAGS="${BASE}:${BRANCH}"
            # Is there a branch v{MAJOR}.{MINOR}.X with X > PATCH?
            NEWER_PATCH=$(git ls-remote --heads origin \
              | grep -oP "refs/heads/v${MAJOR}\.${MINOR}\.\K[0-9]+$" \
              | sort -n | awk -v p="$PATCH" '$1 > p' | head -1)
            if [[ -z "$NEWER_PATCH" ]]; then
              TAGS="${TAGS},${BASE}:v${MAJOR}.${MINOR}"
              # Is there a branch v{MAJOR}.X.Y with X > MINOR?
              NEWER_MINOR=$(git ls-remote --heads origin \
                | grep -oP "refs/heads/v${MAJOR}\.\K[0-9]+(?=\.[0-9]+$)" \
                | sort -n | awk -v m="$MINOR" '$1 > m' | head -1)
              if [[ -z "$NEWER_MINOR" ]]; then
                TAGS="${TAGS},${BASE}:v${MAJOR}"
              fi
            fi
          else
            TAGS="${BASE}:${BRANCH}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
