name: Auto-tag Renovate patches

on:
  push:
    branches: ["master"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Check if all unreleased commits are Renovate patches
        id: check
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [[ -z "$LATEST" ]]; then
            echo "No existing tag found; skipping auto-tag, first release must be created manually."
            echo "renovate_only_commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Auto-tag only if every commit since the last tag was authored by Renovate
          NON_RENOVATE=$(git log "${LATEST}..HEAD" --format='%ae %an' | grep -vi 'renovate' || true)
          if [[ -z "$NON_RENOVATE" ]]; then
            echo "renovate_only_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unreleased non-Renovate commits found since ${LATEST}; skipping auto-tag."
            echo "renovate_only_commits=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine next patch version
        if: steps.check.outputs.renovate_only_commits == 'true'
        id: version
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        if: steps.check.outputs.renovate_only_commits == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "auto-tag[bot]"
          git config user.email "auto-tag[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
