name: CI

on:
  pull_request:
    branches: ["master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: go vet
        run: go vet ./...
      - name: go fmt
        run: gofmt -d .

  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Install dependencies
        run: go mod download
      - name: go build
        run: go build -o oidc-ext-authz main.go
      - name: go test
        run: go test ./...
